services:
  api:
    build:
      context: ../..
      dockerfile: deploy/docker/api/Dockerfile
    image: linkforge-api:${IMAGE_TAG:-v1.0.0}
    environment:
      PORT: "8080"
      DATABASE_PATH: /app/data/linkforge.db
    ports:
      - "8080:8080"
    volumes:
      - linkforge-data:/app/data
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/web/Dockerfile
    image: linkforge-web:${IMAGE_TAG:-v1.0.0}
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  linkforge-data:
