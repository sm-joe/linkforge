services:
  api:
    build:
      context: ../..
      dockerfile: deploy/docker/api/Dockerfile
    image: linkforge-api:local
    restart: unless-stopped

    environment:
      PORT: "8080"
      DATABASE_PATH: /app/data/linkforge.db

    ports:
      - "8080:8080"

    volumes:
      - linkforge_data:/app/data

    read_only: true

    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    pids_limit: 100
    mem_limit: 512m
    cpus: "1.0"

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "--quiet",
          "http://127.0.0.1:8080/healthz"
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/web/Dockerfile
    image: linkforge-web:local
    restart: unless-stopped

    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: http://localhost:8080

    ports:
      - "3000:3000"

    read_only: true

    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    pids_limit: 100
    mem_limit: 512m
    cpus: "1.0"

volumes:
  linkforge_data:
    name: linkforge_data