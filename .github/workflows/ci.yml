name: LinkForge CI/CD Pipeline

on:
  pull_request:
    branches: 
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: linkforge-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/linkforge-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/linkforge-web
  TRIVY_VERSION: v0.75.0

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest

    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      ci: ${{ steps.filter.outputs.ci }}
      any: ${{ steps.filter.outputs.any }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
          
      - name: Path Filter
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/url-validation/**'
              - 'deploy/docker/api/**'

            web:
              - 'apps/web/**'
              - 'deploy/docker/web/**'

            ci:
              - '.github/workflows/**'
              - 'deploy/**'
              - '.dockerignore'

            any:
              - 'apps/**'
              - 'packages/**'
              - 'deploy/**'
              - '.github/**'
              - '.dockerignore'
  test:
    name: Go Tests
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.api == 'true' ||
      needs.changes.outputs.ci == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: |
            apps/api/go.sum
            packages/url-validation/go.sum

      - name: Test API
        working-directory: apps/api
        run: go test -race ./...

      - name: Vet API
        working-directory: apps/api
        run: go vet ./...

      - name: Test URL validation
        working-directory: packages/url-validation
        run: go test ./...

      - name: Vet URL validation
        working-directory: packages/url-validation
        run: go vet ./...

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    needs: changes

    if: needs.changes.outputs.any == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Gitleaks Scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    needs: changes

    if: needs.changes.outputs.any == 'true'

    permissions:
      contents: read
      security-events: write
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
            enabled: ${{ needs.changes.outputs.api == 'true' || needs.changes.outputs.ci == 'true' }}

          - language: javascript-typescript
            build-mode: none
            enabled: ${{ needs.changes.outputs.web == 'true' || needs.changes.outputs.ci == 'true' }}

    steps:
      - name: Checkout
        if: matrix.enabled
        uses: actions/checkout@v7

      - name: Setup Go
        if: matrix.enabled && matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: |
            apps/api/go.sum
            packages/url-validation/go.sum

      - name: Initialize CodeQL
        if: matrix.enabled
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build Go projects
        if: matrix.enabled && matrix.language == 'go'
        run: |
          go build ./apps/api/...
          go build ./packages/url-validation/...

      - name: Analyze CodeQL
        if: matrix.enabled
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  trivy-sca:
    name: Trivy SCA
    runs-on: ubuntu-latest
    needs: changes

    if: needs.changes.outputs.any == 'true'

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Trivy Dependency Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-sca.sarif
          exit-code: "1"

      - name: Upload SCA Results to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-sca.sarif
          category: trivy-sca


  dockerfile:
    name: Dockerfile Security
    runs-on: ubuntu-latest
    needs: changes
    
    if: needs.changes.outputs.any == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Checkov Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: dockerfile
          soft_fail: false

  trivy-fs:
    name: Filesystem Security
    runs-on: ubuntu-latest
    needs: changes
    
    if: needs.changes.outputs.any == 'true'

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          format: sarif
          output: trivy-filesystem.sarif
          exit-code: "0"
          severity: CRITICAL,HIGH

      - name: Upload Filesystem Results to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-filesystem.sarif
          category: trivy-filesystem

  build:
    name: Build & Scan ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs:
      - changes
      - test
      - secrets
      - codeql
      - trivy-sca
      - dockerfile
      - trivy-fs

    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (
        needs.changes.outputs.api == 'true' ||
        needs.changes.outputs.web == 'true' ||
        needs.changes.outputs.ci == 'true'
      )

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API
            component: api
            changed: ${{ needs.changes.outputs.api == 'true' || needs.changes.outputs.ci == 'true' }}
            image: ghcr.io/${{ github.repository_owner }}/linkforge-api
            dockerfile: deploy/docker/api/Dockerfile
            cache-scope: api

          - name: Web
            component: web
            changed: ${{ needs.changes.outputs.web == 'true' || needs.changes.outputs.ci == 'true' }}
            image: ghcr.io/${{ github.repository_owner }}/linkforge-web
            dockerfile: deploy/docker/web/Dockerfile
            cache-scope: web

    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push CI Image
        if: matrix.changed
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ matrix.image }}:ci-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            cache-from: type=gha,scope=${{ matrix.cache-scope }}
            cache-to: type=gha,mode=max,scope=${{ matrix.cache-scope }}

      - name: Trivy Image Scan
        if: matrix.changed
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ matrix.image }}:ci-${{ github.sha }}
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-${{ matrix.component }}-image.sarif
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Upload Image Results to GitHub Code Scanning
        if: always() && matrix.changed
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.component }}-image.sarif
          category: trivy-image-${{ matrix.component }}

      - name: Generate SBOMs
        if: matrix.changed
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ matrix.image }}:ci-${{ github.sha }}
          format: cyclonedx
          output: ${{ matrix.component }}-sbom.cdx.json
          exit-code: "0"
          skip-setup-trivy: true

      - name: Upload SBOMs
        if: matrix.changed
        uses: actions/upload-artifact@v7
        with:
          name: linkforge-${{ matrix.component }}-sbom-${{ github.sha }}
          path: ${{ matrix.component }}-sbom.cdx.json
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    needs: 
      - changes
      - build

    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (
        needs.changes.outputs.api == 'true' ||
        needs.changes.outputs.web == 'true' ||
        needs.changes.outputs.ci == 'true'
      )

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Promote API image
        if: needs.changes.outputs.api == 'true' || needs.changes.outputs.ci == 'true'
        env:
          IMAGE: ${{ env.API_IMAGE }}
          SOURCE: ${{ env.API_IMAGE }}:ci-${{ github.sha }}
        run: |
          docker pull "$SOURCE"

          DIGEST=$(docker inspect \
            --format='{{index .RepoDigests 0}}' \
            "$SOURCE")

          docker tag "$SOURCE" "$IMAGE:${{ github.sha }}"
          docker tag "$SOURCE" "$IMAGE:latest"

          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

          echo "API image:"
          echo "$DIGEST"

          cosign sign --yes "$IMAGE:${{ github.sha }}"

          cosign verify "$IMAGE:${{ github.sha }}" --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/.*" --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

          echo "LINKFORGE_API_IMAGE=$DIGEST" >> "$GITHUB_ENV"

      - name: Promote Web Image
        if: needs.changes.outputs.web == 'true' || needs.changes.outputs.ci == 'true'
        env:
          IMAGE: ${{ env.WEB_IMAGE }}
          SOURCE: ${{ env.WEB_IMAGE }}:ci-${{ github.sha }}
        run: |
          docker pull "$SOURCE"

          DIGEST=$(docker inspect \
            --format='{{index .RepoDigests 0}}' \
            "$SOURCE")

          docker tag "$SOURCE" "$IMAGE:${{ github.sha }}"
          docker tag "$SOURCE" "$IMAGE:latest"

          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

          echo "Web image:"
          echo "$DIGEST"

          cosign sign --yes "$IMAGE:${{ github.sha }}"

          cosign verify "$IMAGE" --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/.*" --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

          echo "LINKFORGE_WEB_IMAGE=$DIGEST" >> "$GITHUB_ENV"

      - name: Generate deployment references
        run: |
          mkdir -p deployment

          {
            echo "# Generated from commit ${{ github.sha }}"

            if [ -n "${LINKFORGE_API_IMAGE:-}" ]; then
              echo "LINKFORGE_API_IMAGE=${LINKFORGE_API_IMAGE}"
            fi

            if [ -n "${LINKFORGE_WEB_IMAGE:-}" ]; then
              echo "LINKFORGE_WEB_IMAGE=${LINKFORGE_WEB_IMAGE}"
            fi
          } > deployment/images.env

          cat deployment/images.env

      - name: Upload deployment references
        uses: actions/upload-artifact@v7
        with:
          name: linkforge-deployment-images-${{ github.sha }}
          path: deployment/images.env
          if-no-files-found: error
          retention-days: 30